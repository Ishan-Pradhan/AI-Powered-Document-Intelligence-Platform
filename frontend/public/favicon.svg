<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1926" />
      <stop offset="100%" stop-color="#0f3446" />
    </linearGradient>
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#2aaad5" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="1" y="1" width="30" height="30" rx="7" fill="url(#bg)" stroke="#1e465a" stroke-width="1" />

  <!-- Document Body with corner fold -->
  <path d="M7 8a2 2 0 0 1 2-2h7l6 6v12a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V8z" fill="url(#docGrad)" />

  <!-- Folded flap at top-right -->
  <path d="M16 6v4a2 2 0 0 0 2 2h4l-6-6z" fill="url(#foldGrad)" />

  <!-- Document Lines representing data / text -->
  <rect x="10" y="14" width="6" height="1.5" rx="0.75" fill="#0284c7" opacity="0.85" />
  <rect x="10" y="17.5" width="8" height="1.5" rx="0.75" fill="#64748b" opacity="0.6" />
  <rect x="10" y="21" width="5" height="1.5" rx="0.75" fill="#64748b" opacity="0.5" />

  <!-- AI Sparkle / Intelligence Star -->
  <g filter="url(#glow)">
    <path d="M22.5 15.5c0 2.2 1.3 3.5 3.5 3.5-2.2 0-3.5 1.3-3.5 3.5 0-2.2-1.3-3.5-3.5-3.5 2.2 0 3.5-1.3 3.5-3.5z" fill="url(#aiGrad)" />
    <circle cx="22.5" cy="19" r="0.75" fill="#ffffff" />
  </g>
  <circle cx="16" cy="11" r="0.65" fill="#38bdf8" />
</svg>